name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Go tests
        run: go test ./...

      - name: Build web UI
        working-directory: web
        run: |
          npm ci
          npm run test:unit
          npm run build

      - name: Embed web UI
        run: |
          rm -rf webui/dist
          cp -a web/.output/public webui/dist

      - name: Build release binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/disaster37/gobot-simulate.Version=${VERSION}" \
              -o "dist/gobot-simulate_${VERSION}_${os}_${arch}" ./cmd/gobot-simulate
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish container image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${{ github.repository }}:${VERSION}"
          docker build --build-arg VERSION="${VERSION}" -t "$image" -t "ghcr.io/${{ github.repository }}:latest" .
          docker push "$image"
          docker push "ghcr.io/${{ github.repository }}:latest"

      - name: Publish Nuxt layer
        working-directory: web/layer
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          npm version "$version" --no-git-tag-version
          npm publish --access public

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file CHANGELOG.md \
            dist/*
