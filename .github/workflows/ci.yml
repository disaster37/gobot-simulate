name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Dagger CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go (generated-artifact drift check)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "v0.21.8"

      - name: Run canonical Dagger CI pipeline
        run: make ci
